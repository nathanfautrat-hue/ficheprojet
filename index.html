<!DOCTYPE html>
<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiche Projet — Studio FTT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9f9; color: #0d0d0d; min-height: 100vh; }
    .page { max-width: 620px; margin: 0 auto; padding: 2rem 1.5rem; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 28px; font-weight: 600; color: #0d0d0d; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #999; }
    .card { background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .section-title { font-size: 18px; font-weight: 600; color: #FF5A47; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1.25rem; }
    .field-label { display: block; font-size: 13px; font-weight: 600; color: #0d0d0d; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="tel"], select, textarea {
      width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
      border: 1px solid #ddd; border-radius: 4px; background: #fff; color: #0d0d0d;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #FF5A47; box-shadow: 0 0 0 3px rgba(255,90,71,0.1); }
    textarea { resize: vertical; min-height: 80px; }
    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .checkbox-item input { width: 16px; height: 16px; cursor: pointer; accent-color: #FF5A47; flex-shrink: 0; }
    .btn-row { display: flex; gap: 12px; margin-top: 2rem; }
    .btn { flex: 1; padding: 13px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; border: none; }
    .btn-primary { background: #FF5A47; color: #fff; }
    .btn-secondary { background: #fff; color: #0d0d0d; border: 1px solid #ddd; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .progress-bar { height: 3px; background: #f0f0f0; border-radius: 2px; margin-bottom: 2rem; overflow: hidden; }
    .progress-fill { height: 100%; background: #FF5A47; border-radius: 2px; transition: width 0.3s; }
    .step { display: none; }
    .step.active { display: block; }
    .success { text-align: center; padding: 2rem 0; }
    .success .check { font-size: 56px; margin-bottom: 1rem; }
    .success h2 { font-size: 24px; font-weight: 600; margin-bottom: 0.75rem; }
    .success p { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 2rem; }
    @media (max-width: 480px) { .checkbox-grid { grid-template-columns: 1fr; } .page { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Fiche Projet</h1>
    <p id="step-indicator">Etape 1 sur 5</p>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:20%"></div>
  </div>
  <div class="card">

    <div class="step active" id="step-1">
      <div class="section-title">Informations generales</div>
      <div class="field"><label class="field-label">Nom de l'entreprise *</label><input type="text" id="companyName"></div>
      <div class="field"><label class="field-label">Responsable / Contact *</label><input type="text" id="ownerName"></div>
      <div class="field"><label class="field-label">Email *</label><input type="email" id="email" placeholder="contact@votre-site.fr"></div>
      <div class="field"><label class="field-label">Telephone</label><input type="tel" id="phone" placeholder="06 XX XX XX XX"></div>
      <div class="field">
        <label class="field-label">Secteur d'activite *</label>
        <select id="sector">
          <option value="">Selectionner...</option>
          <option>BTP / Artisan (plombier, electricien, chauffagiste)</option>
          <option>Macon / Couvreur / Charpentier</option>
          <option>Paysagiste / Elagueur / Menuisier</option>
          <option>Garage / Carrosserie</option>
          <option>Kine / Osteo / Sophrologue / Bien-etre</option>
          <option>Coach sportif</option>
          <option>Photographe / Videaste</option>
          <option>Consultant / Formateur / Coach business</option>
          <option>Commerce / Niche</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="btn-row"><button class="btn btn-primary" onclick="goTo(2)">Suivant</button></div>
    </div>

    <div class="step" id="step-2">
      <div class="section-title">Votre projet web</div>
      <div class="field"><label class="field-label">Avez-vous un site web actuellement ?</label><input type="text" id="currentWebsite" placeholder="URL ou laisser vide si non"></div>
      <div class="field">
        <label class="field-label">Objectif principal du site *</label>
        <select id="objective">
          <option value="">Selectionner...</option>
          <option>Presenter l'entreprise (vitrine / credibilite)</option>
          <option>Generer des demandes de devis</option>
          <option>Informer et fideliser les clients</option>
          <option>Permettre la prise de rendez-vous</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="field"><label class="field-label">Qui est votre public cible ?</label><textarea id="targetAudience" placeholder="Ex: particuliers en Sarthe, professionnels BTP..."></textarea></div>
      <div class="field"><label class="field-label">Sites web que vous aimez / concurrents ?</label><textarea id="competitors" placeholder="Liens ou noms - notez ce qui vous plait"></textarea></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goTo(1)">Precedent</button>
        <button class="btn btn-primary" onclick="goTo(3)">Suivant</button>
      </div>
    </div>

    <div class="step" id="step-3">
      <div class="section-title">Specifications</div>
      <div class="field">
        <label class="field-label">Budget estime *</label>
        <select id="budget">
          <option value="">Selectionner...</option>
          <option>Vitrine — 500 €</option>
          <option>Visibilite — 750 € (SEO avance + Google Business)</option>
          <option>Sur-mesure — a partir de 1 000 €</option>
          <option>Pas encore defini</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Delai souhaite *</label>
        <select id="timeline">
          <option value="">Selectionner...</option>
          <option>Urgent (3-5 jours)</option>
          <option>Standard (1-2 semaines)</option>
          <option>Flexible (pas presse)</option>
        </select>
      </div>
      <div class="field"><label class="field-label">Nombre de pages souhaite</label><input type="text" id="pages" placeholder="Ex: 5-8 pages"></div>
      <div class="field">
        <label class="field-label">Avez-vous des photos / visuels pour votre site ?</label>
        <select id="content">
          <option value="">Selectionner...</option>
          <option>Oui, j'ai mes photos</option>
          <option>Non, je n'en ai pas</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goTo(2)">Precedent</button>
        <button class="btn btn-primary" onclick="goTo(4)">Suivant</button>
      </div>
    </div>

    <div class="step" id="step-4">
      <div class="section-title">Services additionnels</div>
      <div class="field">
        <label class="field-label" style="margin-bottom:12px">Cochez ce qui vous interesse :</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" value="Referencement naturel (SEO)"> Referencement (SEO)</label>
          <label class="checkbox-item"><input type="checkbox" value="Google Business / Maps"> Google Business / Maps</label>
          <label class="checkbox-item"><input type="checkbox" value="Maintenance mensuelle"> Maintenance mensuelle</label>
          <label class="checkbox-item"><input type="checkbox" value="Galerie réalisations"> Galerie réalisations</label>
          <label class="checkbox-item"><input type="checkbox" value="Formulaire de devis avancé"> Formulaire de devis avancé</label>
          <label class="checkbox-item"><input type="checkbox" value="Section témoignages"> Section témoignages</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goTo(3)">Precedent</button>
        <button class="btn btn-primary" onclick="goTo(5)">Suivant</button>
      </div>
    </div>

    <div class="step" id="step-5">
      <div class="section-title">Remarques</div>
      <div class="field"><label class="field-label">Y a-t-il autre chose a nous dire ?</label><textarea id="remarks" rows="6" placeholder="Contraintes, charte graphique, logo disponible, autres demandes..."></textarea></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goTo(4)">Precedent</button>
        <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">Envoyer ma fiche</button>
      </div>
    </div>

    <div class="step" id="step-success">
      <div class="success">
        <div class="check">✓</div>
        <h2 id="success-name">Merci !</h2>
        <p>Votre fiche projet a bien ete envoyee. Notre equipe vous contactera rapidement.</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn btn-secondary" onclick="downloadTxt()" style="flex:0 0 auto;padding:13px 28px">Telecharger ma fiche</button>
        </div>
      </div>
    </div>

  </div>
  <p style="text-align:center;font-size:12px;color:#bbb;margin-top:1.5rem">Studio FTT — Creation de sites web</p>
  <p style="text-align:center;font-size:11px;margin-top:0.75rem;margin-bottom:2rem">
    <button onclick="openModal('ml')" style="background:none;border:none;color:#bbb;cursor:pointer;font-size:11px;text-decoration:underline;padding:0">Mentions legales</button>
    &nbsp;·&nbsp;
    <button onclick="openModal('rgpd')" style="background:none;border:none;color:#bbb;cursor:pointer;font-size:11px;text-decoration:underline;padding:0">Donnees personnelles</button>
    &nbsp;·&nbsp;
    <button onclick="openModal('cgv')" style="background:none;border:none;color:#bbb;cursor:pointer;font-size:11px;text-decoration:underline;padding:0">CGV</button>
  </p>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="closeModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;padding:1rem;overflow-y:auto">
  <div onclick="event.stopPropagation()" style="background:#fff;border-radius:8px;max-width:600px;margin:2rem auto;padding:2rem;font-size:12px;color:#555;line-height:1.7;position:relative">
    <button onclick="closeModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:20px;cursor:pointer;color:#999;line-height:1">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
var MODALS = {
  ml: '<h2 style="font-size:16px;font-weight:600;color:#0d0d0d;margin-bottom:1.25rem">Mentions légales</h2>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Éditeur</strong><br>Nathan Fautrat — Studio FTT<br>7 rue du Fromenteau, 72270 Arthezé, France<br>SIRET : 10404864000015<br>Email : <a href="mailto:contactstudioftt@gmail.com" style="color:#FF5A47">contactstudioftt@gmail.com</a></p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Hébergement</strong><br>Cloudflare Inc., 101 Townsend Street, San Francisco CA 94107, USA</p>'
    + '<p><strong style="color:#333">Hébergement</strong><br>Cloudflare Inc., 101 Townsend Street, San Francisco CA 94107, USA</p>',

  rgpd: '<h2 style="font-size:16px;font-weight:600;color:#0d0d0d;margin-bottom:1.25rem">Données personnelles</h2>'
    + '<p style="margin-bottom:0.75rem">Les informations saisies dans ce formulaire (nom, email, téléphone, données projet) sont collectées uniquement pour répondre à votre demande et établir un devis.</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Conservation</strong><br>3 ans maximum. Elles ne sont jamais revendues ni transmises à des tiers.</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Vos droits (RGPD)</strong><br>Accès, rectification, suppression, portabilité. Contactez-nous : <a href="mailto:contactstudioftt@gmail.com" style="color:#FF5A47">contactstudioftt@gmail.com</a></p>'
    + '<p><strong style="color:#333">Réclamation</strong><br>Auprès de la CNIL : <a href="https://www.cnil.fr" target="_blank" style="color:#FF5A47">cnil.fr</a></p>',

  cgv: '<h2 style="font-size:16px;font-weight:600;color:#0d0d0d;margin-bottom:1.25rem">Conditions Générales de Vente</h2>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Objet</strong><br>Les présentes CGV régissent les prestations de création de sites web sur-mesure réalisées par Studio FTT (Nathan Fautrat, SIRET 10404864000015) pour tout client ayant accepté un devis.</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Commande</strong><br>Toute prestation débute après acceptation écrite du devis (email ou signature). Le devis vaut bon de commande.</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Paiement</strong><br>Un acompte de 50 % est dû à la commande, le solde à la livraison du site. Paiement par virement bancaire. Tout retard de paiement entraîne des pénalités de 10 %/an.</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Délais</strong><br>Les délais indiqués (3 jours à 2 semaines) sont donnés à titre indicatif et conditionnés à la fourniture des contenus par le client dans les temps convenus.</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Modifications</strong><br>1 modification gratuite est incluse à la livraison. Au-delà, les modifications sont facturées 50 €/h ou couvertes par le forfait maintenance (35 €/mois, 3 modifications incluses).</p>'
    + '<p style="margin-bottom:0.75rem"><strong style="color:#333">Propriété intellectuelle</strong><br>Les droits sur le site sont transférés au client après règlement complet. Studio FTT conserve le droit de mentionner la réalisation à titre de référence.</p>'
    + '<p><strong style="color:#333">Droit applicable</strong><br>Droit français. En cas de litige, compétence exclusive du Tribunal de Commerce du Mans.</p>'
};

function openModal(key) {
  document.getElementById('modal-content').innerHTML = MODALS[key];
  document.getElementById('modal-overlay').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  document.body.style.overflow = '';
}


<script>
var cur = 1;

function goTo(n) {
  document.getElementById('step-' + cur).classList.remove('active');
  cur = n;
  document.getElementById('step-' + cur).classList.add('active');
  document.getElementById('step-indicator').textContent = 'Etape ' + n + ' sur 5';
  document.getElementById('progress').style.width = (n / 5 * 100) + '%';
  window.scrollTo(0, 0);
}

function getChecked() {
  var v = [];
  document.querySelectorAll('#step-4 input[type=checkbox]:checked').forEach(function(b) { v.push(b.value); });
  return v.length ? v.join(', ') : 'Aucun';
}

function submitForm() {
  var btn = document.getElementById('submitBtn');
  btn.textContent = 'Envoi en cours...';
  btn.disabled = true;

  var data = {
    Entreprise:   document.getElementById('companyName').value,
    Responsable:  document.getElementById('ownerName').value,
    Email:        document.getElementById('email').value,
    Telephone:    document.getElementById('phone').value,
    Secteur:      document.getElementById('sector').value,
    Site_actuel:  document.getElementById('currentWebsite').value || 'Aucun',
    Objectif:     document.getElementById('objective').value,
    Public_cible: document.getElementById('targetAudience').value,
    Concurrents:  document.getElementById('competitors').value,
    Budget:       document.getElementById('budget').value,
    Delai:        document.getElementById('timeline').value,
    Nb_pages:     document.getElementById('pages').value,
    Photos:       document.getElementById('content').value,
    Services:     getChecked(),
    Remarques:    document.getElementById('remarks').value || 'Aucune'
  };

  fetch('https://formspree.io/f/mrerogor', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.ok || res.next) {
      showSuccess();
    } else {
      throw new Error('Erreur Formspree');
    }
  })
  .catch(function() {
    btn.textContent = 'Envoyer ma fiche';
    btn.disabled = false;
    alert('Une erreur est survenue. Verifiez votre connexion et reessayez.');
  });
}

function showSuccess() {
  var n = document.getElementById('ownerName').value || 'vous';
  document.getElementById('success-name').textContent = 'Merci ' + n + ' !';
  document.getElementById('step-5').classList.remove('active');
  document.getElementById('step-success').classList.add('active');
  document.getElementById('step-indicator').textContent = 'Formulaire envoye';
  document.getElementById('progress').style.width = '100%';
  window.scrollTo(0, 0);
}

function downloadTxt() {
  var lines = [
    'FICHE PROJET - ' + document.getElementById('companyName').value,
    '================================================',
    '',
    'INFORMATIONS',
    'Entreprise   : ' + document.getElementById('companyName').value,
    'Responsable  : ' + document.getElementById('ownerName').value,
    'Email        : ' + document.getElementById('email').value,
    'Telephone    : ' + document.getElementById('phone').value,
    'Secteur      : ' + document.getElementById('sector').value,
    '',
    'PROJET WEB',
    'Site actuel  : ' + (document.getElementById('currentWebsite').value || 'Aucun'),
    'Objectif     : ' + document.getElementById('objective').value,
    'Public cible : ' + document.getElementById('targetAudience').value,
    'Concurrents  : ' + document.getElementById('competitors').value,
    '',
    'SPECIFICATIONS',
    'Budget       : ' + document.getElementById('budget').value,
    'Delai        : ' + document.getElementById('timeline').value,
    'Nb pages     : ' + document.getElementById('pages').value,
    'Photos       : ' + document.getElementById('content').value,
    '',
    'SERVICES',
    getChecked(),
    '',
    'REMARQUES',
    document.getElementById('remarks').value || 'Aucune'
  ];
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type: 'text/plain'}));
  a.download = 'fiche-projet-' + (document.getElementById('companyName').value || 'client').replace(/\s+/g, '-') + '.txt';
  a.click();
}
</script>


</body></html>
